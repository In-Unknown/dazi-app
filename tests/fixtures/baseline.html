  }
  actions.appendChild(next);
  board.append(description, grid, status, actions);
  targetEl.appendChild(board);
  if (!isListening) renderAlphabetPractice();
}

function renderAlphabetPractice(message = '') {
  const complete = state.alphabetPos === ALL_LETTERS.length;
  const ready = state.alphabetCompleted >= ALPHABET_PRACTICE_ROUNDS;
  document.querySelectorAll('.alphabet-tile').forEach((tile, index) => {
    tile.classList.toggle('done', index < state.alphabetPos);
    tile.classList.toggle('ghost', index >= state.alphabetPos);
    tile.classList.toggle('current', index === state.alphabetPos);
  });
  const status = document.getElementById('introStatus');
  status.className = 'intro-status' + (message ? ' error' : complete ? ' success' : '');
  const roundLabel = ready ? `已完成 ${state.alphabetCompleted} 轮` : `已完成 ${state.alphabetCompleted} / ${ALPHABET_PRACTICE_ROUNDS} 轮`;
  status.textContent = `${roundLabel} · ` + (message || (complete
    ? (ready ? '可以开始填空，也可以再练一轮' : `本轮全部正确，即将自动开始第 ${state.alphabetCompleted + 1} 轮`)
    : `本轮 ${state.alphabetPos} / 26 · 下一个字母 ${ALL_LETTERS[state.alphabetPos]}`));
  document.getElementById('lessonContinue').disabled = !ready;
  document.getElementById('lessonRetry').hidden = !(complete && ready);
}

function startChapter(idx){
  state.chapterIndex = (idx + CH.length) % CH.length;
  state.round = 0;
  state.errors = 0;
  const ch = CH[state.chapterIndex];
  state.lessonPhase = ch.isLetterMatchMode || ch.isLetterClozeMode ? 'intro' : null;
  state.introHeard = new Set();
  state.alphabetPos = 0;
  state.alphabetCompleted = 0;
  state.matchTypeQueue = [];
  state.lastMatchType = '';
  state.matchQuestion = null;
  state.clozeQueue = [];
  state.lastClozeTarget = '';
  chTitleEl.textContent = ch.title;
  chDescEl.textContent  = ch.desc;

  state.roundList = ch.buildList
    ? ch.buildList()
    : (ch.gen ? Array.from({ length: ch.rounds || 15 }, () => ch.gen()) : []);

  renderTimeline();
  updateDebugPanel();
  startRound();
}

function startRound(){
  const ch = CH[state.chapterIndex];
  document.querySelector('main').scrollTop = 0;
  chDescEl.textContent = state.lessonPhase === 'intro'
    ? (ch.isLetterMatchMode ? '学习准备 · 逐个试听 A–Z，准备好后继续' : '学习准备 · 完整输入 A–Z 三轮，输错重来当前轮')
    : ch.desc;
  clearTimeout(state.lessonTimer);
  cancelAnimationFrame(state.raf);
  stopLetterAudio();
  resetInputMode(ch);
  state.running = false;
  state.locked = false;
  state.clozeTarget = '';
  targetEl.classList.remove('ok', 'shake');
  flashEl.classList.remove('show');
  const isLetterLesson = !!(ch.isLetterMatchMode || ch.isLetterClozeMode);
  document.body.classList.toggle('letter-lesson', isLetterLesson);
  if (isLetterLesson) {
    state.items = [];
    targetEl.style.fontSize = '16px';
    barEl.style.transform = 'scaleX(0)';
    updateHUD();
    promptEl.style.visibility = 'visible';
    hintEl.style.visibility = 'hidden';
    targetEl.classList.remove('scroll-mode', 'bm-mode');
    if (state.lessonPhase === 'intro') {
      renderLessonIntro();
      return;
    }
  }

  // ---------------------------------------------
  // 第 1 章【音符匹配】专门出题
  // ---------------------------------------------
  if (ch.isLetterMatchMode) {
    state.hasPeekedInRound = false;
    promptEl.textContent = '听发音，匹配对应的字母';
    promptEl.style.visibility = 'visible';
    hintEl.style.visibility = 'hidden';
    targetEl.classList.remove('scroll-mode', 'bm-mode');

    const mastery = lessonMastery();
    if (mastery.completion === 1) {
      state.round = 0;
      startChapter(state.chapterIndex + 1);
      return;
    }

    // 题型交错，所有题型保留干扰音，最后一项也需要辨认发音。
    const question = makeMatchQuestion();
    state.matchQuestion = question;
    const targetLetters = question.targets;

    targetEl.innerHTML = '';
    const board = document.createElement('div');
    board.className = 'match-board';
    board.dataset.kind = question.type;
    const instruction = document.createElement('p');
    instruction.className = 'match-instruction';
    const typeLabel = {single: '单字辨音', contrast: '易混字母', board: '多项配对'}[question.type];
    instruction.textContent = `${typeLabel} · ${question.audios.length} 段发音，${targetLetters.length} 个字母 · 先听音，再点字母确认`;

    // 左列为音频，右列为字母；每列都使用原生按钮支持键盘操作。
    const colLeft = document.createElement('div');
    colLeft.className = 'match-col match-audios';
    colLeft.innerHTML = '<span class="match-col-label">听发音</span>';
    const colRight = document.createElement('div');
    colRight.className = 'match-col match-letters';
    colRight.innerHTML = '<span class="match-col-label">选字母</span>';
    let selectedAudio = null;
    let matchedCount = 0;
    const helpNote = document.createElement('p');
    helpNote.className = 'match-help-note';
    helpNote.setAttribute('role', 'status');
    helpNote.textContent = '字母旁的试听提示会清空本章全部熟练度';

    const selectCard = (column, card) => {
      column.querySelectorAll('.match-card').forEach(c => {
        c.classList.toggle('selected', c === card);
        const button = c.matches('button') ? c : c.querySelector('.match-letter-select');
        button.setAttribute('aria-pressed', String(c === card));
      });
    };
    const checkPair = (letterCard) => {
      if (!selectedAudio) {
        helpNote.textContent = '先试听左侧发音，再点击右侧字母确认配对';
        return;
      }
      const audioCard = selectedAudio;
      const l = letterCard.dataset.letter;
      selectCard(colLeft, null);
      selectCard(colRight, null);
      selectedAudio = null;
      if (audioCard.dataset.letter === l) {
        stopLetterAudio();
        playSuccessSound();
        audioCard.classList.add('matched');
        letterCard.classList.add('matched');
        audioCard.disabled = true;
        letterCard.querySelectorAll('button').forEach(button => button.disabled = true);
        matchedCount++;
        if (matchedCount === targetLetters.length) {
          // 仅在整组全部完成后加分，未完成的配对不提前计入熟练度。
          if (!state.hasPeekedInRound) {
            targetLetters.forEach(letter => {
              changePartMastery(state.matchMastery, letter, 1);
            });
          }
          updateHUD();
          state.locked = true;
          state.lessonTimer = setTimeout(() => { state.round++; startRound(); }, 600);
        }
      } else {
        playErrorSound();
        // 只扣当前被考查的音频字母，允许反复扣到该部分的下限。
        changePartMastery(state.matchMastery, audioCard.dataset.letter, -1);
        state.errors++;
        updateHUD();
        audioCard.classList.add('wrong');
        letterCard.classList.add('wrong');
        setTimeout(() => {
          audioCard.classList.remove('wrong');
          letterCard.classList.remove('wrong');
        }, 450);
      }
    };

    question.audios.forEach((l, index) => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'match-card';
      card.dataset.letter = l;
      card.setAttribute('aria-label', `播放第 ${index + 1} 个发音`);
      card.setAttribute('aria-pressed', 'false');
      const heights = [6, 12, 19, 13, 25, 18, 28, 20, 14, 21, 12, 8, 4];
      card.innerHTML = speakerIcon + `<span class="audio-wave" aria-hidden="true">${heights.map((height, i) => `<i style="--bar-height:${height}px;--bar-delay:${i * -45}ms"></i>`).join('')}</span>`;
      card.onclick = () => {
        if (state.locked || card.disabled) return;
        playLetterAudio(l, card);
        selectCard(colLeft, card);
        selectedAudio = card;
      };
      colLeft.appendChild(card);
    });

    targetLetters.forEach(l => {
      const card = document.createElement('div');
      card.className = 'match-card';
      card.dataset.letter = l;
      card.innerHTML = `<button type="button" class="match-letter-select" aria-label="选择字母 ${l}" aria-pressed="false">${l}</button><button type="button" class="listen-icon-btn" aria-label="试听字母 ${l}（清空本章全部熟练度）" title="试听 ${l} · 清空本章全部熟练度">${speakerIcon}</button>`;
      card.querySelector('.match-letter-select').onclick = () => {
        if (state.locked || card.classList.contains('matched')) return;
        checkPair(card);
      };
      card.querySelector('.listen-icon-btn').onclick = () => {
        if (state.locked || card.classList.contains('matched')) return;
        playLetterAudio(l);
        resetLessonMastery();
        helpNote.textContent = '本章熟练度已清零，本组不计分';
      };
      colRight.appendChild(card);
    });

    board.appendChild(colLeft);
    board.appendChild(colRight);
    const exercise = document.createElement('div');
    exercise.className = 'match-exercise';
    exercise.append(instruction, board, helpNote);
    targetEl.appendChild(exercise);
    return;
  }

  // ---------------------------------------------
  // 第 2 章【顺序完形填空】专门出题
  // ---------------------------------------------
  if (ch.isLetterClozeMode) {
    state.hasPeekedInRound = false;
    promptEl.textContent = '补全空缺的 3 个连续字母';
    promptEl.style.visibility = 'visible';
    hintEl.style.visibility = 'hidden';
    targetEl.classList.remove('scroll-mode', 'bm-mode');

    // 从 ABC 到 XYZ 的全部三元组合，与熟练度统计共用同一份键列表。
    const mastery = lessonMastery();
    const triList = mastery.keys;

    if (mastery.completion === 1) {
      state.round = 0;
      startChapter(state.chapterIndex + 1);
      return;
    }

    // 所有组合均保留在洗牌题袋中，已达标组合也可以积累超额分数。
    if (!state.clozeQueue.length) {
      state.clozeQueue = shuffle([...triList]);
      if (state.clozeQueue.length > 1 && state.clozeQueue[0] === state.lastClozeTarget) state.clozeQueue.push(state.clozeQueue.shift());
    }
    const currentTri = state.clozeQueue.shift();
    state.lastClozeTarget = currentTri;
    const triStartIdx = ALL_LETTERS.indexOf(currentTri[0]);

    // 构造题目：展示上下文，挖空中间 3 个字母
    // 例如：前放 2 个已知字母，后放 2 个已知字母
    const preContext = ALL_LETTERS.slice(Math.max(0, triStartIdx - 2), triStartIdx);
    const postContext = ALL_LETTERS.slice(triStartIdx + 3, Math.min(26, triStartIdx + 5));

    targetEl.innerHTML = '';
    const container = document.createElement('div');
    container.className = 'cloze-board';

    const slotsRow = document.createElement('div');
    slotsRow.className = 'cloze-slots';
    slotsRow.setAttribute('role', 'group');
    slotsRow.setAttribute('aria-label', '按顺序输入三个缺失字母');

    // 前置已知
    preContext.forEach(c => {
      slotsRow.innerHTML += `<span class="cloze-char">${c}</span>`;
    });

    // 3 个空位
    for (let i = 0; i < 3; i++) {
      slotsRow.innerHTML += `<span class="cloze-gap" id="gap_${i}"></span>`;
    }

    // 后置已知
    postContext.forEach(c => {
      slotsRow.innerHTML += `<span class="cloze-char">${c}</span>`;
    });

    container.appendChild(slotsRow);
    const status = document.createElement('div');
    status.id = 'clozeStatus';
    status.className = 'cloze-status';
    status.setAttribute('role', 'status');
    status.textContent = '填完后自动检查 · 可按 Backspace 修改';
    container.appendChild(status);

    // 提示放在输入区下方，直接在未填空位显示淡色答案。
    const help = document.createElement('div');
    help.className = 'cloze-help';
    const peekBtn = document.createElement('button');
    peekBtn.type = 'button';
    peekBtn.className = 'peek-btn';
    peekBtn.setAttribute('aria-pressed', 'false');
    peekBtn.setAttribute('aria-describedby', 'clozeHelpNote');
    peekBtn.innerHTML = eyeIcon + '<span>显示提示</span>';
    const note = document.createElement('span');
    note.id = 'clozeHelpNote';
    note.className = 'cloze-help-note';
    note.textContent = '查看将清空本章全部熟练度';
    peekBtn.onclick = () => {
      if (state.locked) return;
      state.clozeShowHints = !state.clozeShowHints;
      if (state.clozeShowHints) {
        resetLessonMastery();
        note.textContent = '本章熟练度已清零';
      }
      peekBtn.setAttribute('aria-pressed', String(state.clozeShowHints));
      peekBtn.querySelector('span').textContent = state.clozeShowHints ? '隐藏提示' : '显示提示';
      renderClozeInput();
    };
    help.append(peekBtn, note);
    container.appendChild(help);
    targetEl.appendChild(container);

    // 设置打字监听：直接在键盘敲出这 3 个字母
    state.clozeTarget = currentTri;
    state.clozeInput = [];
    state.clozeInputIdx = 0;
    state.clozeShowHints = false;
    renderClozeInput();
    return;
  }

  let item = state.roundList[state.round % state.roundList.length];

  state.prompt = item.prompt || '';
  state.hint   = item.hint   || '';

  // 2. 核心架构：如果是第 20 章及之后且有 prompt，直接运行 AST 编译器
  if (state.chapterIndex >= 21 && state.prompt) {
    const compiled = compilePrompt(state.prompt, item.mode || ch.mode || 'full');
    promptEl.innerHTML = '';
    promptEl.appendChild(compiled.promptFrag);
    state.items = compiled.items;
    state.promptCharEls = compiled.charRefs;
    state.promptWordEls = compiled.wordRefs;
    state.promptMappingActive = true;
  } else {
    let text = sanitizeText(item.text);
    state.items = expandSymbols(text);
    promptEl.innerHTML = '';
    promptEl.textContent = state.prompt;
    state.promptMappingActive = false;
  }

  state.pos = 0;
  state.locked = false;

  const base = 1800 + state.items.length * 1100;
  const mult = SPEED_TIERS[state.tier];
  state.limit    = Math.round(base * mult);
  state.deadline = performance.now() + state.limit;
  state.running  = true;

  promptEl.style.visibility = state.prompt ? 'visible' : 'hidden';
  hintEl.textContent = state.hint;
  hintEl.style.visibility = state.hint ? 'visible' : 'hidden';

  targetEl.classList.remove('scroll-mode');
  targetEl.style.fontSize = fontSizeFor(state.items.length);
  targetEl.classList.remove('ok', 'shake');

  barEl.style.transform = 'scaleX(1)';
  barEl.style.background = 'var(--done)';

  buildDOM();

  // 智能长文提词器滚动判定
  const isBlankMode = !!CH[state.chapterIndex]?.isBlankLineMode;

  if (isBlankMode && state.bmTopRow && state.bmBtmRow) {
    // 空行模式：分别测量上下两层，内容超标时各自开启滑动视口，短文本时自然展示
    if (state.bmTopRow.scrollHeight > 130) {
      state.bmTopRow.classList.add('scroll-box');
    }
    if (state.bmBtmRow.scrollHeight > 140) {
      state.bmBtmRow.classList.add('scroll-box');
    }
  } else {
    // 常规模式：维持单容器视口滚动
    const threshold = Math.min(280, window.innerHeight * 0.42);
    const needsScroll = state.items.length > 25 || targetEl.scrollHeight > threshold;
    if (needsScroll) {
      targetEl.classList.add('scroll-mode');
    }
  }

  targetEl.scrollTop = 0;
  updateDOM();
  updateHUD();
  renderTimeline();
  updateRawBox();

  cancelAnimationFrame(state.raf);
  state.raf = requestAnimationFrame(tick);
}

function updateRawBox(){
  const raw = $('#rawBox');
  if (!raw) return;
  const lines = state.items.map((it, i) => {
    let tag = it.type;
    if (it.type === 'char') tag += `[${it.display}|hint=${it.hint||''}|shift=${it.shift}|base=${it.baseKey}]`;
    else if (it.type.includes('shift') || it.type.includes('caps')) tag += `[${it.color}/${it.expected||''}]`;
    const mark = (i === state.pos) ? '▶ ' : '  ';
    return `${mark}${String(i).padStart(3,'0')} ${tag}`;
  }).join('\n');
  raw.textContent = lines;
}

function tick(){
  if (!state.running) return;
  const left = state.deadline - performance.now();
  if (left <= 0){ onMistake(true); return; }

  const pct = Math.max(0, left / state.limit);
  barEl.style.transform = `scaleX(${pct})`;
  barEl.style.background = pct > 0.5 ? 'var(--done)'
                        : pct > 0.25 ? 'var(--warn)'
                        : 'var(--danger)';

  state.raf = requestAnimationFrame(tick);
}

function onMistake(isTimeout){
  if (!state.running || state.locked) return;

  playErrorSound(); // 触发沉闷下坠失败音效！

  state.running = false;
  state.locked  = true;
  cancelAnimationFrame(state.raf);
  state.errors++;
  updateHUD();

  barEl.style.transform = 'scaleX(0)';
  targetEl.classList.remove('shake');
  void targetEl.offsetWidth;
  targetEl.classList.add('shake');

  flashEl.textContent = isTimeout
    ? '⏱ 超时 · 本章从第 1 题重来'
    : '✗ 键位、修饰键或时机错误 · 从第 1 题重来';
  flashEl.classList.add('show');

  state.lessonTimer = setTimeout(() => {
    flashEl.classList.remove('show');
    state.round = 0;
    startRound();
  }, 1000);
}

function handleCorrect(){
  const completedItem = state.items[state.pos];
  state.pos++;
  if (completedItem.type === 'caps-down') {
    state.inputCaps = !state.inputCaps;
  } else if (completedItem.type === 'shift-down' && !completedItem.isImeToggle) {
    state.inputShift = true;
  } else if (completedItem.type === 'shift-up') {
    if (completedItem.isImeToggle) state.inputIme = state.inputIme === 'en' ? 'zh' : 'en';
    else state.inputShift = false;
  }
  updateInputIndicators();

  updateDOM();
  updateRawBox();

  if (state.pos >= state.items.length){
    onComplete();
  }
}

function onComplete(){
  playSuccessSound(); // 触发多邻国过关大三和弦清脆音效！

  state.running = false;
  state.locked  = true;
  cancelAnimationFrame(state.raf);
  barEl.style.transform = 'scaleX(0)';
  targetEl.classList.add('ok');

  state.round++;
  const total = CH[state.chapterIndex].rounds || 15;

  state.lessonTimer = setTimeout(() => {
    if (state.round >= total){
      const next = state.chapterIndex + 1;
      if (next >= CH.length){
        state.tier = Math.min(state.tier + 1, SPEED_TIERS.length - 1);
        startChapter(0);
      } else {
        startChapter(next);
      }
    } else {
      startRound();
    }
  }, 480);
}

/* =========================================================
   严格状态机处理：杜绝偷按、长按误杀
   ========================================================= */
function renderClozeInput() {
  for (let i = 0; i < state.clozeTarget.length; i++) {
    const gap = document.getElementById(`gap_${i}`);
    if (!gap) continue;
    const value = state.clozeInput[i];
    const isGhost = !value && state.clozeShowHints;
    gap.textContent = value || (isGhost ? state.clozeTarget[i] : '\u00a0');
    gap.classList.toggle('ghost', isGhost);
    gap.classList.toggle('active', !state.locked && i === state.clozeInput.length);
    gap.setAttribute('aria-label', `第 ${i + 1} 个空：${value || (isGhost ? '提示 ' + state.clozeTarget[i] : '未填写')}`);
  }
  state.clozeInputIdx = state.clozeInput.length;
}

function checkClozeAnswer() {
  if (state.locked || state.clozeInput.length !== state.clozeTarget.length) return;
  state.locked = true;
  renderClozeInput();
  const correct = state.clozeInput.join('') === state.clozeTarget;
  const status = document.getElementById('clozeStatus');
  document.querySelector('.peek-btn').disabled = true;
  state.clozeInput.forEach((value, i) => {
    document.getElementById(`gap_${i}`).classList.add(value === state.clozeTarget[i] ? 'done' : 'wrong');
  });
  if (correct) {
    playSuccessSound();
    if (!state.hasPeekedInRound) {
      changePartMastery(state.clozeMastery, state.clozeTarget, 1);
    }
    updateHUD();
    status.className = 'cloze-status success';
    status.textContent = '全部正确';
    state.lessonTimer = setTimeout(() => { state.round++; startRound(); }, 650);
  } else {
    playErrorSound();
    changePartMastery(state.clozeMastery, state.clozeTarget, -1);
    state.errors++;
    updateHUD();
    status.className = 'cloze-status error';
    status.textContent = '顺序不太对，再试一次';
    // 留出阅读反馈的时间，然后重试当前题，保留已经查看过提示的记录。
    state.lessonTimer = setTimeout(() => {
      state.clozeInput = [];
      state.locked = false;
      document.querySelectorAll('.cloze-gap').forEach(gap => gap.classList.remove('done', 'wrong'));
      document.querySelector('.peek-btn').disabled = false;
      status.className = 'cloze-status';
      status.textContent = '填完后自动检查 · 可按 Backspace 修改';
      renderClozeInput();
    }, 1000);
  }
}

document.addEventListener('keydown', e => {
  if (!overlay.classList.contains('hide') || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target instanceof Element && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  const code = e.code || e.key;
  const isShift = code === 'ShiftLeft' || code === 'ShiftRight' || code === 'Shift';
  const isCaps = code === 'CapsLock';
  // 顺序准备页逐字检查，正题仍然保持整题输入完才检查。
  if (state.lessonPhase === 'intro') {
    if (!CH[state.chapterIndex].isLetterClozeMode || state.locked) return;
    if (e.target instanceof Element && e.target.closest('button') && (code === 'Space' || code === 'Enter')) return;
    if (state.alphabetPos === ALL_LETTERS.length || isShift || isCaps) return;
    const letter = inputLetter(code);
    const key = codeToChar(code);
    if (!letter && (key === 'Enter' || (key === null && code !== 'Backspace'))) return;
    e.preventDefault();
    if (letter === ALL_LETTERS[state.alphabetPos]) {
      state.alphabetPos++;
      const complete = state.alphabetPos === ALL_LETTERS.length;
      if (complete) {
        state.alphabetCompleted++;
        playSuccessSound();
      } else {
        playKeySuccessSound();
      }
      renderAlphabetPractice();
      (document.querySelector('.alphabet-tile.current') || document.getElementById('introStatus')).scrollIntoView({block: 'nearest'});
      if (complete && state.alphabetCompleted < ALPHABET_PRACTICE_ROUNDS) {
        state.locked = true;
        state.lessonTimer = setTimeout(() => {
          state.alphabetPos = 0;
          state.locked = false;
          renderAlphabetPractice();
          document.querySelector('.alphabet-tile.current').scrollIntoView({block: 'nearest'});
        }, 450);
      }
    } else {
      state.alphabetPos = 0;
      state.errors++;
      updateHUD();
      playErrorSound();
      renderAlphabetPractice('输入不正确，已从 A 重新开始');
      document.querySelector('.alphabet-tile.current').scrollIntoView({block: 'nearest'});
    }
    return;
  }
  // 如果当前是完形填空模式，直接截获按键
  const chCloze = CH[state.chapterIndex];
  if (chCloze && chCloze.isLetterClozeMode && state.clozeTarget) {
    if (code === 'Backspace') {
      e.preventDefault();
      if (!state.locked) { state.clozeInput.pop(); renderClozeInput(); }
      return;
    }
    const letter = inputLetter(code);
    if (!letter) return;
    e.preventDefault();
    if (state.locked) return;
    state.clozeInput.push(letter);
    renderClozeInput();
    if (state.clozeInput.length === state.clozeTarget.length) checkClozeAnswer();
    return;
  }

  if (!state.running || state.locked) return;

  const item = state.items[state.pos];
  if (!item) return;

  if (item.type === 'shift-down'){
    if (isShift){
      e.preventDefault(); handleCorrect();
    } else {
      onMistake(false);
    }
    return;
  }
  
  if (item.type === 'caps-down'){
    if (isCaps){
      e.preventDefault(); handleCorrect();
    } else {
      onMistake(false);
    }
    return;
  }

  if (item.type === 'shift-up'){
    if (isShift) return; // 按住放行
    onMistake(false);
    return;
  }
  if (item.type === 'caps-up'){
    if (isCaps) return; // 按住放行
    onMistake(false);
    return;
  }

  if (isCaps){
    onMistake(false);
    return;
  }

  if (isShift){
    if (item.type === 'char' && item.shift === true) return;
    onMistake(false);
    return;
  }

  const k = codeToChar(code);
  if (k === null){
    onMistake(false);
    return;
  }
  
  if (k === ' ' || k === 'Enter' || k === '/' || k === "'" || k === 'CapsLock'){
    e.preventDefault();
  }

  if (item.type === 'sp'){
    if (k === ' ') handleCorrect();
    else onMistake(false);
    return;
  }
  if (item.type === 'nl'){
    if (k === 'Enter') handleCorrect();
    else onMistake(false);
    return;
  }

  if (item.type === 'char'){
    const keyMatch = k.toLowerCase() === item.baseKey.toLowerCase();
    
    let shiftMatch = true;
    if (item.shift === true) shiftMatch = state.inputShift;
    if (item.shift === false) shiftMatch = !state.inputShift;
    const caseMatch = !/^[a-z]$/i.test(item.display) || inputLetter(code) === item.display;
    const requiredIme = item.requiredIme || getRequiredIme(item.display);
    const imeMatch = !requiredIme || state.inputIme === requiredIme;

    if (keyMatch && shiftMatch && caseMatch && imeMatch){
      handleCorrect();
    } else {
      onMistake(false);
    }
  }
});

document.addEventListener('keyup', e => {
  if (!overlay.classList.contains('hide') || !state.running || state.locked) return;
  const code = e.code || e.key;
  const item = state.items[state.pos];
  if (!item) return;

  if (code === 'ShiftLeft' || code === 'ShiftRight' || code === 'Shift'){
    if (item.type === 'shift-up'){
      handleCorrect();
    } else {
      onMistake(false);
    }
    return;
  }

  if (code === 'CapsLock'){
    if (item.type === 'caps-up'){
      handleCorrect();
    } else {
      onMistake(false);
    }
    return;
  }
});

/* =========================================================
   外部词库加载
   ========================================================= */
const fileInput = $('#fileInput');
const fileInfo  = $('#fileInfo');

$('#loadBtn').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buffer = await file.arrayBuffer();
    let text = '';
    let encodingUsed = 'UTF-8';

    const utf8Decoder = new TextDecoder('utf-8', { fatal: false });
    text = utf8Decoder.decode(buffer);

    if (text.includes('\uFFFD')) {
      try {
        const gbkDecoder = new TextDecoder('gbk');
        const gbkText = gbkDecoder.decode(buffer);
        const utf8Bad = (text.match(/\uFFFD/g) || []).length;
        const gbkBad  = (gbkText.match(/\uFFFD/g) || []).length;
        if (gbkBad < utf8Bad){
          text = gbkText;
          encodingUsed = 'GBK/ANSI';
        }
      } catch (err){
        console.warn('浏览器不支持 GBK 解码，请把文件另存为 UTF-8', err);
      }
    }

    const lines = text.split(/\r?\n/)
      .map(s => sanitizeText(s.trim()))
      .filter(s => s && !s.startsWith('#'));

    if (!lines.length){
      fileInfo.textContent = '文件为空或未识别到有效内容';
      return;
    }

    SENTENCES = lines;
    fileInfo.textContent = `已加载 ${lines.length} 句（编码：${encodingUsed}）`;
  } catch (err){
    fileInfo.textContent = '读取失败：' + err.message;
  }
});

/* =========================================================
   调试面板
   ========================================================= */
const debugPanel  = $('#debugPanel');
const debugToggle = $('#debugToggle');
const dbgList     = $('#dbgList');
const dbgTiers    = $('#dbgTiers');

debugToggle.addEventListener('click', () => {
  debugPanel.classList.toggle('hide');
});
$('#dbgClose').addEventListener('click', () => {
  debugPanel.classList.add('hide');
});

function updateDebugPanel(){
  dbgTiers.innerHTML = '';
  SPEED_TIERS.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'dbg-tier-btn' + (i === state.tier ? ' cur' : '');
    btn.textContent = `${i + 1}`;
    btn.title = `时间倍率 ×${m}`;
    btn.onclick = () => {
      state.tier = i;
      updateHUD();
      updateDebugPanel();
      startRound();
    };
    dbgTiers.appendChild(btn);
  });

  dbgList.innerHTML = '';
  CH.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.className = 'dbg-item' + (i === state.chapterIndex ? ' cur' : '');
    const num = String(i + 1).padStart(2, '0');
    btn.innerHTML = `<span class="dbg-num">${num}</span>${ch.title}`;
    btn.onclick = () => startChapter(i);
    dbgList.appendChild(btn);
  });
}

prepareLetterAudio().catch(e => console.warn('字母音频准备失败:', e));

  getAudioContext(); // 用户首次点击时预激活音频上下文，避免首次音效延迟
  const start = $('#startBtn');
  start.disabled = true;
  try {

  } catch (e) {
    $('#fileInfo').textContent = '字母发音未能准备，请点击开始重试。';
    start.disabled = false;
    return;
  }
  start.disabled = false;
  overlay.classList.add('hide');
  startChapter(0);
});

  if (!pinyinProAvailable()){
    $('#pinyinWarn').classList.add('show');
  }
  updateDebugPanel();
});

chTitleEl.textContent = CH[0].title;
chDescEl.textContent  = CH[0].desc;
promptEl.style.visibility = 'hidden';
hintEl.style.visibility   = 'hidden';
state.roundList = [];
renderTimeline();
updateHUD();
updateDebugPanel();
