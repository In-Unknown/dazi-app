<div id="app">
  <header>
    <div class="hleft">
      <div id="chTitle">大写字母</div>
      <div id="chDesc">按下屏幕上显示的按键</div>
    </div>

    <!-- 顶部状态栏（居中包含输入法与大小写状态指示器） -->
    <div id="topStatus">
      <div id="imeMode" title="当前模拟输入法状态">EN</div>
      <div id="capsMode" title="本站输入大小写状态">大写</div>
    </div>

    <div class="hright">
      <div id="tier">难度 1 / 4</div>
      <div id="round">1 / 30</div>
      <div id="err">错误 0</div>
    </div>
  </header>

  <div id="timeline"></div>

  <main>
    <div id="prompt"></div>
    <div id="target" lang="en"></div>
    <div id="hint"></div>
  </main>

  <footer>
    <div class="barwrap"><div id="bar"></div></div>
  </footer>
</div>

<div id="pinyinWarn">拼音库未加载，已启用内置回退字表</div>
<div id="flash"></div>

<div id="debugToggle" title="调试面板">⚙</div>
<div id="debugPanel" class="hide">
  <div class="dbg-header">
    <span>调试 · 跳转</span>
    <button id="dbgClose">×</button>
  </div>
  <div class="dbg-label">难度</div>
  <div class="dbg-tiers" id="dbgTiers"></div>
  <div class="dbg-label">章节</div>
  <div id="dbgList"></div>
  <div class="dbg-label">当前状态与序列</div>
  <div id="rawBox"></div>
</div>

<div id="overlay">
  <div class="home-glow" aria-hidden="true"></div>
  <div class="home-card">
    <div class="home-badge" aria-hidden="true">
      <span class="home-key">A</span>
      <span class="home-key">键</span>
    </div>
    <h1>键盘练习</h1>
    <p class="home-tagline">从字母到拼音，把手指练成本能</p>
    <div class="row">
      <button id="startBtn">开始练习</button>
      <button id="loadBtn">加载外部词库</button>
    </div>
    <div id="fileInfo"></div>
    <input type="file" id="fileInput" accept=".txt" style="display: none" />
  </div>
</div>
